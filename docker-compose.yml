# Launch Radar deployment stack: worker + Postgres + dead-man heartbeat.
#
# Usage: place a filled-in `.env` next to this file (see .env.example),
# then `docker compose up -d --build`. See DEPLOY.md for the full runbook.
#
# `.env` is written for host-side tooling (its DATABASE_URL points at
# localhost) — `env_file: .env` seeds each container from it, but the
# `environment:` block below always overrides DATABASE_URL with the
# in-network `postgres` hostname so the host value never leaks in unchanged.
services:
  postgres:
    image: postgres:16.11@sha256:468e1f126ca5af849799cda06ac9b03d8090aae9fa5163408b3e8da44fad0702
    restart: unless-stopped
    environment:
      POSTGRES_DB: launch_radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Uncomment to expose host-side backups (see scripts/backup.sh) inside
      # the container, e.g. for `pg_restore` from a mounted dump without
      # `docker cp`:
      # - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d launch_radar"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: .
    image: assay-worker:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/launch_radar
    depends_on:
      postgres:
        condition: service_healthy

  deadman:
    # Same image as `worker` — building it here too lets `docker compose up
    # --build` work standalone; compose builds an identical (`build:` +
    # `image:`) config only once and reuses it for both services.
    build: .
    image: assay-worker:latest
    command: ["bun", "apps/worker/src/deadman.ts"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/launch_radar
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
